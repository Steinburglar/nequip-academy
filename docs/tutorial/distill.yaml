#   DEPRECATED -- DOES NOT RUN
# ==========================================================================
# This config drives `nequip-distill`, a CLI deleted on 2026-09-18. The package
# now contributes a `data:` datamodule to plain `nequip-train`; see planning.md
# section 11 and examples/rattle_train_datamodule.yaml. Port this once the
# refactor settles.
# ==========================================================================

# ==========================================================================
#   DISTILLATION CONFIG -- `nequip-distill`
# ==========================================================================
# This config drives ONE command:
#
#   nequip-distill -cn distill
#
# which does four things in a row, in a single process:
#
#   1. `sample`  -- deform and rattle the base frames into new structures
#   2. label     -- evaluate each new structure with the *teacher* model
#   3. `train`   -- train a small *student* model on those labels
#   4. `val`/`test` -- evaluate the student on frozen held-out splits
#
# Everything from the `seed:` line down is an ordinary NequIP config, handed
# to NequIP's own trainer untouched. Only the four keys above it (`run`,
# `sample_path`, `sampler`, and the absence of `split_dataset`) are new.
#
# The teacher here is the fine-tuned foundation model produced by the
# previous section of this tutorial. It is accurate on silicon but large and
# slow, and it carries every chemical species the foundation model was
# trained on. The student is a small, silicon-only network. Distillation is
# how we move the teacher's accuracy into it without any new DFT.


# ===========
#     RUN
# ===========
# `nequip-distill` extends NequIP's `run` with one extra stage: `sample`.
# It must come first, and it may appear at most once. Everything after it is
# passed straight through to NequIP.
#
#   [sample, train, val, test]  -- full distillation, the case below
#   [sample]                    -- build the dataset only, train later
#   [train, val, test]          -- reuse an existing dataset, e.g. to sweep
#                                  student architectures without re-labeling
run: [sample, train, val, test]


# where the generated, teacher-labeled structures are written.
#
# `sample_path` is a directory, and it is the memory of the sampling stage.
# It is deliberately NOT inside the hydra output directory: a dataset is
# expensive (one teacher forward pass per structure) and outlives any single
# command, while a hydra run directory is per-command. Point a second run at
# the same `sample_path` and sampling resumes where it stopped instead of
# starting over. Delete the directory to sample from scratch.
sample_path: ./distill_dataset


# ================
#     SAMPLING
# ================
sampler:
  # `RattleSampler` deforms and rattles static structures. (`MDSampler` runs
  # teacher-driven molecular dynamics instead; same slot, different `_target_`.)
  _target_: nequip_extension_template.sample.RattleSampler

  # -- the teacher ---------------------------------------------------------
  # Any ASE calculator works here. We use the fine-tuned model from the
  # previous section, packaged with `nequip-package build`:
  #
  #   nequip-package build ./results_ft/best.ckpt ./teacher.nequip.zip
  #
  # `_from_saved_model` is the load path for `.nequip.zip` packages (and raw
  # `.ckpt` files). `from_compiled_model` is the other one, for
  # `nequip-compile` output -- faster, but architecture-locked to the GPU it
  # was compiled on, which matters if you sample on a different machine than
  # you compiled on.
  calculator:
    _target_: nequip.integrations.ase.NequIPCalculator._from_saved_model
    model_path: ./teacher.nequip.zip
    device: cuda
    chemical_species_to_atom_type_map: true

  # -- what to deform ------------------------------------------------------
  # The 110 silicon frames the tutorial already trained on. They carry DFT
  # energies, forces and stresses; those are DISCARDED. Only the geometry is
  # used, and the teacher supplies fresh labels for every structure it
  # generates -- including for the undeformed variant.
  base_frames: ./sitraj.xyz

  # -- the deformations ----------------------------------------------------
  # Per base frame, one structure per "variant":
  #   * one per entry in `strain_magnitudes`: an isotropic volume scan, the
  #     cell scaled by (1 + strain)^(1/3) with the atoms carried along
  #   * `n_random_strain_samples` more with a random symmetric anisotropic
  #     strain, each component bounded by `anisotropic_strain_magnitude`
  # and then, in both cases, every atom displaced by up to
  # `max_displacement_ang` in a random direction.
  #
  # 3 + 2 = 5 variants x 110 base frames = 550 structures, so 550 teacher
  # forward passes.
  strain_magnitudes: [-0.05, 0.0, 0.05]
  n_random_strain_samples: 2
  anisotropic_strain_magnitude: 0.05
  max_displacement_ang: 0.25

  # KEEP THESE CONSERVATIVE. In the work this sampler is ported from, +/-10%
  # strain with 0.5 Ang displacement pushed structures far enough out of the
  # teacher's domain that the teacher's labels there were wrong, and students
  # trained on them came out *worse* than students given no synthetic data at
  # all. Halving to the values above fixed it. A teacher is only a teacher
  # where it is accurate.

  # Base seed. Each structure's randomness is derived from this seed plus the
  # content hash of its base frame plus its variant label -- not from one
  # shared stream. So a structure depends only on its own identity, never on
  # how many structures came before it, which is what lets an interrupted run
  # resume and reproduce exactly the structures an uninterrupted run would
  # have written.
  seed: 1

  # -- splitting -----------------------------------------------------------
  # The train/val/test split is decided HERE, as structures are generated,
  # and written to three separate files. It is never recomputed at training
  # time. That is the point: grow the dataset later and nothing already on
  # disk changes split, so a structure can never migrate from test into train
  # behind your back -- which is exactly what fraction-based splitting of one
  # growing file would do.
  #
  # The split is assigned per BASE FRAME, not per structure: the 5 variants
  # of one base frame are near-duplicates of each other, so separating them
  # would put effectively the same structure in both train and validation.
  # 88/11/11 base frames -> 440/55/55 structures.
  split: {train: 0.8, val: 0.1, test: 0.1}
  # "scattered" shuffles base frames before apportioning them; "blocked"
  # hands out contiguous ranges of the input file instead (which is what you
  # want for a time-ordered MD trajectory).
  split_policy: scattered
  split_seed: 0


# ==========================================================================
#   STUDENT -- an ordinary NequIP config from here down
# ==========================================================================
# Two things differ from the tutorial's `config.yaml`:
#   * `data` has NO `split_dataset` and NO `train_file_path` /
#     `val_file_path` / `test_file_path`. `nequip-distill` fills those in
#     with the three files the sampler wrote, and refuses to run if you set
#     them yourself -- otherwise the frozen splits above would be silently
#     overridden.
#   * the model is much smaller than the teacher, and knows only silicon.

seed: 456
cutoff_radius: 5.0
chemical_symbols: [Si]
model_type_names: ${chemical_symbols}
monitored_metric: val0_epoch/weighted_sum
results_dir: ./results_distill


# ============
#     DATA
# ============
data:
  _target_: nequip.data.datamodule.ASEDataModule
  seed: 456

  # (no `split_dataset` and no `*_file_path` -- see the note above)

  transforms:
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names: ${model_type_names}
      chemical_species_to_atom_type_map: ${list_to_identity_dict:${chemical_symbols}}

  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    num_workers: 2
    shuffle: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 10
    num_workers: ${data.train_dataloader.num_workers}
  test_dataloader: ${data.val_dataloader}

  # Note that these statistics are computed over the SAMPLED data, not over
  # `sitraj.xyz` -- the student is normalized to the distribution it will
  # actually see, which is wider than the original trajectory because of the
  # strains and rattles.
  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    dataloader_kwargs:
      batch_size: 10
    type_names: ${model_type_names}


# ===============
#     TRAINER
# ===============
trainer:
  _target_: lightning.Trainer
  accelerator: auto
  enable_checkpointing: true
  max_epochs: 200
  max_time: 00:00:30:00
  log_every_n_steps: 1

  logger:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    name: distill_log
    save_dir: ${results_dir}
    flush_logs_every_n_steps: 100

  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${monitored_metric}
      min_delta: 1e-3
      patience: 20

    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: ${monitored_metric}
      dirpath: ${results_dir}
      filename: best
      save_last: true

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch


# ========================
#     TRAINING MODULE
# ========================
training_module:
  _target_: nequip.train.EMALightningModule
  ema_decay: 0.999

  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0

  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      total_energy_mae: 1.0
      forces_mae: 1.0
  train_metrics: ${training_module.val_metrics}
  test_metrics: ${training_module.val_metrics}

  optimizer:
    _target_: torch.optim.Adam
    lr: 0.01

  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.6
      patience: 5
      threshold: 0.2
      min_lr: 1e-6
    monitor: ${monitored_metric}
    interval: epoch
    frequency: 1

  # == the student ==
  # Smaller than the teacher on purpose: fewer layers, one chemical species,
  # modest feature multiplicity. This is what distillation buys -- the cost
  # of the teacher paid once, offline, in exchange for a model that is cheap
  # to run in MD.
  model:
    _target_: nequip.model.NequIPGNNModel

    seed: ${seed}
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    num_bessels: 8
    bessel_trainable: false
    polynomial_cutoff_p: 6

    num_layers: 2
    l_max: 1
    parity: true
    num_features: 32

    radial_mlp_depth: 2
    radial_mlp_width: 64

    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_scales: ${training_data_stats:per_type_forces_rms}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false

    # ZBL earns its place here more than usual: rattling and compressive
    # strain both create short interatomic distances, and ZBL supplies the
    # correct hard-core repulsion there.
    pair_potential:
      _target_: nequip.nn.pair_potential.ZBL
      units: metal
      chemical_species: ${chemical_symbols}
