# Step-1 config for `nequip-distill` with the MD sampler. Same shape as
# rattle_only.yaml -- only the `sampler` block differs, which is the point.
#
#   python -m nequip_extension_template.scripts.distill \
#       -cp $PWD/examples -cn md_only

run: [sample]

sample_path: sandbox/out/md_smoke

sampler:
  _target_: nequip_extension_template.sample.MDSampler

  calculator:
    _target_: nequip.integrations.ase.NequIPCalculator._from_saved_model
    model_path: sandbox/inputs/teacher.nequip.zip
    device: cuda
    chemical_species_to_atom_type_map: true

  base_frames: sandbox/inputs/base_frames.xyz

  # One trajectory, started from the FIRST base frame; the rest are ignored.
  # Tiny on purpose -- this is a plumbing test, not a production trajectory. A real
  # `sample_interval` has to come from the system's correlation time, not from here.
  temperature_K: 300.0
  timestep_fs: 1.0
  friction_per_fs: 0.01
  n_equilibrate_steps: 5
  sample_interval: 5
  n_samples: 30

  # Per snapshot. `blocked` holds out a contiguous tail of the trajectory, which
  # stays honest even if `sample_interval` under-decorrelates; `scattered` would
  # put validation snapshots between training ones.
  split: {train: 0.8, val: 0.1, test: 0.1}
  split_policy: blocked
  split_seed: 0
  seed: 1
