# Step-1 config for `nequip-distill`: sampling only, no student training.
#
# Paths are relative to the directory the command is launched from (hydra does not
# chdir), so run this from the repository root.
#
#   python -m nequip_extension_template.scripts.distill \
#       -cp $PWD/examples -cn rattle_only

run: [sample]

# where the generated, teacher-labeled structures are written
sample_path: sandbox/out/rattle_smoke

sampler:
  _target_: nequip_extension_template.sample.RattleSampler

  # The teacher. A `nequip-package` artifact, loaded eagerly -- `_from_saved_model`
  # is the only load path for `.nequip.zip`. Not a compiled model: `nequip-compile
  # --mode aotinductor --target ase` output segfaults on its first forward pass in
  # this environment, and `--mode torchscript` is refused outright by torch >= 2.10.
  calculator:
    _target_: nequip.integrations.ase.NequIPCalculator._from_saved_model
    model_path: sandbox/inputs/teacher.nequip.zip
    device: cuda
    chemical_species_to_atom_type_map: true

  # 10 CsH2PO4 frames, real DFT data from ../distillation/results/CDP/dft_subset/.
  # They carry DFT energies and forces; those are discarded, the teacher relabels.
  base_frames: sandbox/inputs/base_frames.xyz

  # No `sample_size`: this procedure is defined by its base frames and variants,
  # and runs to completion -- 10 base frames x 5 variants = 50 structures.
  # Train/val/test fractions. The split is assigned per BASE FRAME, not per
  # structure: the 5 structures rattled from one base frame are near-duplicates,
  # so splitting them apart would leak. 10 base frames at 0.8/0.1/0.1 -> 8/1/1.
  # Base frames have no meaningful order, so `scattered` is right here.
  split: {train: 0.8, val: 0.1, test: 0.1}
  split_policy: scattered
  split_seed: 0

  strain_magnitudes: [-0.05, 0.0, 0.05]
  n_random_strain_samples: 2
  # Independent of `strain_magnitudes` on purpose -- see RattleSampler's docstring.
  anisotropic_strain_magnitude: 0.05
  max_displacement_ang: 0.25
  seed: 1
