# Full distillation through NequIP's native training entry point:
#
#   nequip-train -cp $PWD/examples -cn rattle_train_datamodule
#
# Sampling is owned by `data:`, so there is no special `sample` run stage and no
# top-level `generator:` block. The datamodule materializes train/val/test extxyz
# files under `data.dataset_path`, then NequIP loads them through its normal
# ASEDataModule machinery.

run: [train, val, test]


seed: 1
cutoff_radius: 6.0
model_type_names: [Cs, H, P, O]
monitored_metric: val0_epoch/weighted_sum

data:
  _target_: nequip_academy.data.DistillationDataModule
  _recursive_: false
  seed: ${seed}

  # Held-out set with GROUND-TRUTH labels, not teacher labels: this is what the
  # reported test error should mean. Generation makes train and val only.
  test_file_path: sandbox/inputs/dft_test.xyz

  dataset_path: sandbox/out/rattle_train_datamodule_dataset
  state_interval: 50

  teacher:
    _target_: nequip.integrations.ase.NequIPCalculator._from_saved_model
    model_path: sandbox/inputs/teacher.nequip.zip
    device: cuda
    chemical_species_to_atom_type_map: true

  generation:
    _target_: nequip_academy.sample.RattleGenerator
    base_frames: sandbox/inputs/base_frames.xyz
    split: {train: 0.9, val: 0.1}
    split_policy: scattered
    split_seed: 0
    strain_magnitudes: [-0.05, 0.0, 0.05]
    n_random_strain_samples: 2
    anisotropic_strain_magnitude: 0.05
    max_displacement_ang: 0.25
    seed: 1

  transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names: ${model_type_names}
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}

  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    num_workers: 2
    shuffle: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 5
    num_workers: ${data.train_dataloader.num_workers}
  test_dataloader: ${data.val_dataloader}

  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    dataloader_kwargs:
      batch_size: 5
    type_names: ${model_type_names}

trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  enable_checkpointing: true
  max_epochs: 20
  log_every_n_steps: 5

  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}

  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${monitored_metric}
      min_delta: 1e-3
      patience: 20

    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: ${monitored_metric}
      dirpath: ${hydra:runtime.output_dir}
      filename: best
      save_last: true

    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch

training_module:
  _target_: nequip.train.EMALightningModule
  ema_decay: 0.999

  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0

  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      total_energy_mae: 1.0
      forces_mae: 1.0
  train_metrics: ${training_module.val_metrics}
  test_metrics: ${training_module.val_metrics}

  optimizer:
    _target_: torch.optim.Adam
    lr: 0.005

  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.6
      patience: 5
      threshold: 0.2
      min_lr: 1e-6
    monitor: ${monitored_metric}
    interval: epoch
    frequency: 1

  model:
    _target_: nequip.model.NequIPGNNModel
    seed: ${seed}
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    num_bessels: 8
    bessel_trainable: false
    polynomial_cutoff_p: 6

    num_layers: 2
    l_max: 1
    parity: true
    num_features: [32, 16]

    radial_mlp_depth: 2
    radial_mlp_width: 64

    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_scales: ${training_data_stats:per_type_forces_rms}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false
